apiVersion: 1

# Stable UIDs so cross-datasource links survive restarts and can be referenced
# from dashboards and from each other:
#   prometheus -> uid: prometheus
#   loki       -> uid: loki
#   jaeger     -> uid: jaeger   (datasource provisioned here; the Jaeger service
#                                itself is added in Part 2 / FEAT-002)
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # Extract trace_id from the JSON log line and turn it into a link to Jaeger.
      derivedFields:
        - name: trace_id
          matcherType: regex
          matcherRegex: '"trace_id"\s*:\s*"([a-f0-9]+)"'
          url: '$${__value.raw}'
          datasourceUid: jaeger

  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    jsonData:
      # Jump from a Jaeger trace back to the correlated Loki logs.
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-1h'
        spanEndTimeShift: '1h'
        filterByTraceID: true
        tags:
          - key: service.name
            value: service
