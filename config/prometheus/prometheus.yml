global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: obs-lab

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node_exporter
    static_configs:
      - targets: ["node_exporter:9100"]

  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # service-b is defined in Part 2 (FEAT-002); target may be down until then.
  - job_name: service-b
    metrics_path: /metrics
    static_configs:
      - targets: ["service-b:8001"]
