# Observability lab stack (Part 1). All services share the internal network
# `obsnet`. Only grafana (3000) and api (8000) publish host ports; everything
# else is internal-only and reached via SSH tunnel on EC2.
#
# Part 2 (FEAT-002) adds service-b, otel-collector and jaeger below. Set
# OTEL_ENABLED=true (see .env.example) to turn tracing on; with it off the whole
# stack still runs and the OTel wiring is a no-op.

networks:
  obsnet:
    driver: bridge

volumes:
  prometheus_data:
  loki_data:
  grafana_data:

services:
  api:
    build:
      context: ./app
    image: obs-lab-api:1.0.0
    container_name: obs-lab-api
    environment:
      OTEL_ENABLED: "${OTEL_ENABLED:-false}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}"
      SERVICE_B_URL: "http://service-b:8001"
    ports:
      - "8000:8000"
    depends_on:
      - service-b
    networks:
      - obsnet
    restart: unless-stopped

  service-b:
    build:
      context: ./service-b
    image: obs-lab-service-b:1.0.0
    container_name: obs-lab-service-b
    environment:
      OTEL_ENABLED: "${OTEL_ENABLED:-false}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}"
    # Internal-only: reached by the api over the obsnet network (no host port).
    networks:
      - obsnet
    restart: unless-stopped

  node_exporter:
    image: prom/node-exporter:v1.8.2
    container_name: obs-lab-node-exporter
    command:
      - "--path.rootfs=/host"
    pid: host
    volumes:
      # Mount the host root read-only so node_exporter reports host OS metrics.
      - /:/host:ro
    networks:
      - obsnet
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: obs-lab-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - obsnet
    restart: unless-stopped

  loki:
    image: grafana/loki:3.1.1
    container_name: obs-lab-loki
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./config/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks:
      - obsnet
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.3.1
    container_name: obs-lab-alloy
    command:
      - "run"
      - "/etc/alloy/config.alloy"
      - "--storage.path=/var/lib/alloy/data"
    volumes:
      - ./config/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - obsnet
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: obs-lab-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GF_SECURITY_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - obsnet
    restart: unless-stopped

  # OpenTelemetry Collector (contrib): receives OTLP from api + service-b and
  # forwards traces to Jaeger over OTLP. Internal-only (4317 gRPC / 4318 HTTP).
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    container_name: obs-lab-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    volumes:
      - ./config/otel/otel-collector-config.yml:/etc/otelcol-contrib/config.yml:ro
    depends_on:
      - jaeger
    networks:
      - obsnet
    restart: unless-stopped

  # Jaeger all-in-one: COLLECTOR_OTLP_ENABLED=true makes it accept OTLP on
  # 4317 (gRPC) / 4318 (HTTP). UI on 16686 is published to the host so the
  # student can open it directly by public IP (lab is educational). The
  # Security Group still scopes 16686 to the student's own IP (allowedCidr).
  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: obs-lab-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
    networks:
      - obsnet
    restart: unless-stopped
